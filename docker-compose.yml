version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - parsaping_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    # WireGuard peer management on the host requires elevated network
    # privileges. Uncomment the two lines below ONLY if this container is
    # meant to manage a real wg interface on this host, and set
    # WG_SIMULATED=false in .env. Left commented by default for safety.
    # cap_add:
    #   - NET_ADMIN
    # volumes:
    #   - /etc/wireguard:/etc/wireguard

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  migrate:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run migrate && npm run seed"]

volumes:
  parsaping_pgdata:
